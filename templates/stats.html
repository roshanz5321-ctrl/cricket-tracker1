<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Total Stats | Cricket Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    nav {
      background: rgba(26, 11, 46, 0.95);
      padding: 1rem 2rem;
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-wrap: wrap;
    }
    nav a {
      color: #b8a9c9;
      text-decoration: none;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    nav a:hover, nav a.active {
      color: #ff6b9d;
      background: rgba(255,107,157,0.1);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .filter-box select {
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .filter-box select option {
      background: #2d1b4e;
      color: #fff;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: all 0.3s;
    }
    .stat-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,107,157,0.3);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .player-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      flex-shrink: 0;
      border: 3px solid rgba(255,255,255,0.1);
      color: #fff;
    }
    .stat-info { flex: 1; }
    .stat-info h3 {
      color: #b8a9c9;
      font-size: 0.95rem;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-info .value {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ff6b9d;
      line-height: 1;
    }
    .stat-info .player-name {
      color: #fff;
      font-size: 1rem;
      margin-top: 6px;
    }
    .stat-info .team-name {
      color: #b8a9c9;
      font-size: 0.85rem;
    }
    .chart-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
    }
    .chart-section h2 {
      margin-bottom: 20px;
      font-size: 1.3rem;
      color: #ff6b9d;
    }
    .chart-wrapper {
      position: relative;
      height: 350px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
<a href="/odi">ODI</a>
<a href="/t20">T20</a>
<a href="/test">Test</a>
<a href="/stats">Total Stats</a>
<a href="/teams">Teams</a>
<a href="/records">Records</a>
<a href="/about">About</a>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Career Stats (All Formats)</h1>
      <div class="filter-box">
        <select id="teamFilter" onchange="loadStats()">
          <option value="all">All Teams</option>
        </select>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="player-img">--</div>
        <div class="stat-info"><h3>Loading...</h3></div>
      </div>
    </div>

    <div class="chart-section">
      <h2>Top Run Scorers</h2>
      <div class="chart-wrapper">
        <canvas id="runsChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let allPlayers = [];
    let chartInstance = null;

    async function loadStats() {
      try {
        const [odi, t20, test] = await Promise.all([
          fetch('/api/players/odi').then(r => r.ok ? r.json() : []),
          fetch('/api/players/t20').then(r => r.ok ? r.json() : []),
          fetch('/api/players/test').then(r => r.ok ? r.json() : [])
        ]);

        const map = {};
        [...odi, ...t20, ...test].forEach(p => {
          if (!map[p.name]) {
            map[p.name] = {
              name: p.name,
              team: p.team,
              runs: 0, wickets: 0, hundreds: 0, fifties: 0, matches: 0
            };
          }
          map[p.name].runs += p.runs || 0;
          map[p.name].wickets += p.wickets || 0;
          map[p.name].hundreds += p.hundreds || 0;
          map[p.name].fifties += p.fifties || 0;
          map[p.name].matches += 1;
        });

        allPlayers = Object.values(map);
        const teamFilter = document.getElementById('teamFilter').value;
        const filtered = teamFilter === 'all' ? allPlayers : allPlayers.filter(p => p.team === teamFilter);

        if (filtered.length === 0) {
          document.getElementById('statsGrid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#b8a9c9;">No data found</div>';
          return;
        }

        const topRuns = filtered.reduce((a,b) => a.runs > b.runs ? a : b);
        const topWickets = filtered.reduce((a,b) => a.wickets > b.wickets ? a : b);
        const topHundreds = filtered.reduce((a,b) => a.hundreds > b.hundreds ? a : b);
        const topFifties = filtered.reduce((a,b) => a.fifties > b.fifties ? a : b);
        const topMatches = filtered.reduce((a,b) => a.matches > b.matches ? a : b);
        const bestAvg = filtered.filter(p => p.matches > 0).sort((a,b) => (b.runs/b.matches) - (a.runs/a.matches))[0];

        const cards = [
          { title: 'Top Run Scorer', player: topRuns, value: topRuns.runs.toLocaleString(), sub: 'runs' },
          { title: 'Top Wicket Taker', player: topWickets, value: topWickets.wickets, sub: 'wickets' },
          { title: 'Most Centuries', player: topHundreds, value: topHundreds.hundreds, sub: '100s' },
          { title: 'Most Half Centuries', player: topFifties, value: topFifties.fifties, sub: '50s' },
          { title: 'Most Matches', player: topMatches, value: topMatches.matches, sub: 'formats' },
          { title: 'Best Run Average', player: bestAvg || topRuns, value: bestAvg ? Math.round(bestAvg.runs/bestAvg.matches) : topRuns.runs, sub: 'runs/format' }
        ];

        document.getElementById('statsGrid').innerHTML = cards.map(c => `
          <div class="stat-card">
            <div class="player-img">${c.player.name.split(' ').map(n=>n[0]).join('')}</div>
            <div class="stat-info">
              <h3>${c.title}</h3>
              <div class="value">${c.value}</div>
              <div class="player-name">${c.player.name}</div>
              <div class="team-name">${c.player.team} - ${c.sub}</div>
            </div>
          </div>
        `).join('');

        const teams = [...new Set(allPlayers.map(p => p.team))].sort();
        const select = document.getElementById('teamFilter');
        if (select.options.length <= 1) {
          teams.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t; opt.textContent = t;
            select.appendChild(opt);
          });
        }

        updateChart(filtered);

      } catch (err) {
        console.error(err);
        document.getElementById('statsGrid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#ff6b9d;">Failed to load stats</div>';
      }
    }

    function updateChart(players) {
      const top10 = players.sort((a,b) => b.runs - a.runs).slice(0, 10);
      const ctx = document.getElementById('runsChart').getContext('2d');
      
      if (chartInstance) chartInstance.destroy();
      
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: top10.map(p => p.name.split(' ').pop()),
          datasets: [{
            label: 'Total Runs',
            data: top10.map(p => p.runs),
            backgroundColor: 'rgba(255, 107, 157, 0.8)',
            borderColor: 'rgba(255, 107, 157, 1)',
            borderWidth: 2,
            borderRadius: 8,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(26, 11, 46, 0.95)',
              titleColor: '#ff6b9d',
              bodyColor: '#fff',
              callbacks: {
                label: (ctx) => `${ctx.raw.toLocaleString()} runs`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { color: '#b8a9c9' }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#b8a9c9' }
            }
          }
        }
      });
    }

    loadStats();
  </script>
</body>
</html>
