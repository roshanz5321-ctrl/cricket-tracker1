<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <title>T20 - Cricket Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  
  <!-- Yeh nav styles add karo -->
  <style>
    nav {
      background: rgba(13, 27, 42, 0.95);
      padding: 1rem 2rem;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    nav a {
      color: #8b9dc3;
      text-decoration: none;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    nav a:hover {
      color: #ffd700;
      background: rgba(255,215,0,0.1);
    }
  </style>
  
  <!-- Baaki existing styles -->
  <style>
    .msg { padding: 10px 15px; }
    /* jo bhi already hai */
  </style>
</head>
<body>
  <nav>
  <a href="/">Home</a>
<a href="/odi">ODI</a>
<a href="/t20">T20</a>
<a href="/test">Test</a>
<a href="/stats">Total Stats</a>
<a href="/teams">Teams</a>
<a href="/records">Records</a>
<a href="/about">About</a>
  </nav>

  <div class="hero">
    <h1>🏏 CRICKET TRACKER</h1>
    <p class="tagline">Career T20 Stats</p>
  </div>

  <div class="homeContent">
    <div style="text-align:center; margin-bottom:20px;">
      <input type="text" id="searchBox" placeholder="Search player.." onkeyup="filterPlayers()" style="padding:10px; width:250px; border-radius:6px; border:1px solid #ccc;">
      <button class="btn" onclick="sortBy('runs')" style="margin-left:10px;">Sort by Runs</button>
      <button class="btn" onclick="sortBy('wickets')" style="margin-left:10px;">Sort by Wicket</button>
    </div>

    <div id="msgBox" class="msg"></div>

    <table>
      <thead>
        <tr>
          <th>NAME</th>
          <th>TEAM</th>
          <th>HUNDREDS</th>
          <th>FIFTIES</th>
          <th>RUNS</th>
          <th>WICKET</th>
          <th>ACTION</th>
        </tr>
      </thead>
      <tbody id="playerTable"></tbody>
    </table>

    <div style="background:#fff; padding:25px; border-radius:12px; margin-top:30px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
      <h2 style="text-align:center; color:#0d1b2a;">Add New Player</h2>
      <form id="addForm" class="add-form">
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="team" placeholder="Team" required>
        <input type="number" name="hundreds" placeholder="Hundreds" min="0" required>
        <input type="number" name="fifties" placeholder="Fifties" min="0" required>
        <input type="number" name="runs" placeholder="Runs" min="0" required>
        <input type="number" name="wickets" placeholder="Wickets" min="0" required>
        <button type="submit" class="btn">Add Player</button>
      </form>
    </div>
  </div>

  <script>
    const FORMAT = 't20';
    let allPlayers = [];

    function showMsg(text, isError) {
      const box = document.getElementById('msgBox');
      box.textContent = text;
      box.className = 'msg ' + (isError ? 'error' : 'success');
      setTimeout(() => box.className = 'msg', 3000);
    }

    function loadPlayers() {
      fetch('/api/players/' + FORMAT)
        .then(r => r.json())
        .then(data => {
          allPlayers = data;
          renderTable(data);
        })
        .catch(err => {
          console.error(err);
          showMsg('Players load nahi ho paaye!', true);
        });
    }

    function renderTable(data) {
      const tbody = document.getElementById('playerTable');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px;">No players found.</td></tr>';
        return;
      }
      data.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><a href="/player/${encodeURIComponent(p.name)}" style="color:#1a237e; text-decoration:none; font-weight:600;">${p.name}</a></td>
          <td>${p.team}</td>
          <td>${p.hundreds}</td>
          <td>${p.fifties}</td>
          <td>${p.runs}</td>
          <td>${p.wickets}</td>
          <td><button class="del-btn" onclick="deletePlayer('${p.name.replace(/'/g, "\\'")}')">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterPlayers() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      const filtered = allPlayers.filter(p => p.name.toLowerCase().includes(q));
      renderTable(filtered);
    }

    function sortBy(key) {
      const sorted = [...allPlayers].sort((a, b) => b[key] - a[key]);
      renderTable(sorted);
    }

    document.getElementById('addForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const fd = new FormData(this);
      const payload = {
        name: fd.get('name').trim(),
        team: fd.get('team').trim(),
        format: FORMAT,
        hundreds: Number(fd.get('hundreds')),
        fifties: Number(fd.get('fifties')),
        runs: Number(fd.get('runs')),
        wickets: Number(fd.get('wickets'))
      };

      fetch('/api/players', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(async r => {
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.message || 'Server error');
        }
        return r.json();
      })
      .then(() => {
        showMsg('Player added successfully!', false);
        this.reset();
        loadPlayers();
      })
      .catch(err => {
        console.error(err);
        showMsg('Add failed: ' + err.message, true);
      });
    });

    function deletePlayer(name) {
      if (!confirm('Delete ' + name + '?')) return;
      fetch('/api/players/' + FORMAT + '/' + encodeURIComponent(name), {
        method: 'DELETE'
      })
      .then(r => r.json())
      .then(() => {
        showMsg('Player deleted!', false);
        loadPlayers();
      })
      .catch(() => showMsg('Delete failed!', true));
    }

    loadPlayers();
  </script>
</body>
</html>
