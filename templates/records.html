<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Records - Cricket Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="/">Home</a>
<a href="/odi">ODI</a>
<a href="/t20">T20</a>
<a href="/test">Test</a>
<a href="/stats">Total Stats</a>
<a href="/teams">Teams</a>
<a href="/records">Records</a>
<a href="/about">About</a>
  </nav>

  <div class="hero">
    <h1>🏏 CRICKET TRACKER</h1>
    <p class="tagline">RECORDS</p>
  </div>

  <div class="homeContent">
    <h2>Top Records (All Formats)</h2>
    <div id="recordsCards">
      <div class="loading">⏳ Loading records...</div>
    </div>
  </div>

  <script>
    fetch("/api/records")
      .then(res => {
        if (!res.ok) throw new Error("Server error: " + res.status);
        return res.json();
      })
      .then(data => {
        const container = document.getElementById("recordsCards");
        
        if (!data.top_scorer || !data.top_wicket_taker || !data.top_centuries) {
          throw new Error("API se sahi data nahi aa raha");
        }

        container.innerHTML = `
          <div class="format-card">
            <h2>🏆 Highest Run Scorer</h2>
            <p><strong>${data.top_scorer.name}</strong> (${data.top_scorer.team}, ${data.top_scorer.format})</p>
            <p class="stat-number">${data.top_scorer.runs.toLocaleString()} runs</p>
          </div>
          <div class="format-card">
            <h2>🎯 Highest Wicket Taker</h2>
            <p><strong>${data.top_wicket_taker.name}</strong> (${data.top_wicket_taker.team}, ${data.top_wicket_taker.format})</p>
            <p class="stat-number">${data.top_wicket_taker.wickets} wickets</p>
          </div>
          <div class="format-card">
            <h2>💯 Most Centuries</h2>
            <p><strong>${data.top_centuries.name}</strong> (${data.top_centuries.team}, ${data.top_centuries.format})</p>
            <p class="stat-number">${data.top_centuries.hundreds} centuries</p>
          </div>
        `;
      })
      .catch(err => {
        console.error("Error:", err);
        document.getElementById("recordsCards").innerHTML = `
          <div class="error">
            <h3>⚠️ Records Load Nahi Ho Paaye</h3>
            <p>${err.message}</p>
            <p style="margin-top:15px; font-size:0.9rem;">
              <strong>Check karo:</strong><br>
              1. Flask server run ho raha hai?<br>
              2. Database initialized hai? (<code>python init_db.py</code>)<br>
              3. Players table mein data hai?
            </p>
          </div>
        `;
      });
  </script>
</body>
</html>
